name: Manage NPM Dist Tags

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Tag name (e.g. alpha)'
        required: true
        default: 'alpha'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate with npm via GitHub OIDC
        run: node scripts/oidc-auth.js

      - name: Manage dist-tags
        run: node scripts/tag.js "${{ github.event.inputs.dist_tag }}"
