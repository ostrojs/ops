name: Manage NPM Dist Tags

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Tag name (e.g. alpha)'
        required: true
        default: 'alpha'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Retag packages via npm publish provenance (OIDC)
        run: node scripts/publish-tags.js "${{ github.event.inputs.dist_tag }}"
