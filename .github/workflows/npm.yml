name: Validate Trusted Publisher

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      - name: Download existing auth build and publish to alpha tag with provenance
        run: |
          mkdir pkg && cd pkg
          curl -sL $(npm view @ostro/auth@2.0.0-alpha.2 dist.tarball) | tar -xz --strip-components=1
          npm publish --access public --tag alpha --provenance
