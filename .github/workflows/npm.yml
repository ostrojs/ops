name: NPM Release & Tagging

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (publish | tag)"
        required: true
        default: "tag"
        type: choice
        options:
          - tag
          - publish
      packages:
        description: "Comma-separated package names (or empty for all)"
        required: false
        default: ""
      tag:
        description: "NPM dist-tag to set"
        required: true
        default: "alpha"

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Execute NPM Action
        env:
          ACTION: ${{ github.event.inputs.action }}
          PACKAGES_INPUT: ${{ github.event.inputs.packages }}
          TARGET_TAG: ${{ github.event.inputs.tag }}
        run: |
          node scripts/manage.js
