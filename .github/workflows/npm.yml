name: Validate Trusted Publisher

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@latest

      - name: Match repository in package.json and publish with provenance
        run: |
          mkdir pkg && cd pkg
          curl -sL $(npm view @ostro/auth@2.0.0-alpha.2 dist.tarball) | tar -xz --strip-components=1
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.repository = { type: "git", url: "git+https://github.com/ostrojs/ops.git" };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
          '
          npm publish --access public --tag alpha --provenance
